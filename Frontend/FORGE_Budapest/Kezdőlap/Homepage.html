
<!doctype html>
<html lang="hu">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="theme-color" content="#050505"/>

    <title>Kezdőlap | FORGE Budapest</title>

    <!-- Bootstrap -->
    <link href="../assets/bootstrap/bootstrap.min.css" rel="stylesheet"/>

    <!-- Közös CSS -->
    <link href="../mindegyik oldalhoz/General.css" rel="stylesheet"/>

    <!-- Kezdőlap CSS -->
    <link href="style.css" rel="stylesheet"/>
</head>

<body data-bs-theme="dark" data-page="home">

    <!-- Közös fejléc -->
    <header id="site-header"></header>

    <main class="page-main">

        <section class="home-stage">

            <div class="container home-grid">

                <!-- BAL OLDALI SZÖVEG -->
                <div class="home-text">

                    <div class="place-pin">
                        ●
                        <span>BUDAPEST · 0–24</span>
                    </div>

                    <h1>
                        NE CSAK EDZZ.
                        <br/>
                        <span class="lime">
                            LÉPJ SZINTET.
                        </span>
                    </h1>

                    <p>
                        Modern edzőtér Budapest szívében.
                        Prémium gépek, szakértő edzők és egy
                        közösség, amely minden nap előrébb visz.
                    </p>

                    <div class="btn-row">

                        <a class="btn" href="../Árak/Price.html">
                            KEZDD EL MOST
                            <b>→</b>
                        </a>

                        <a class="btn btn-outline" href="../Árak/Price.html">
                            Bérletek megtekintése
                        </a>

                    </div>

                </div>

                <!-- EDZŐ FOTÓ HELYE -->
                <div
                    aria-label="A Figma edzőfotójának fenntartott helye"
                    class="home-photo">
                </div>

                <!-- BACKENDBŐL BETÖLTÖTT STATISZTIKÁK -->
                <div class="home-metrics">

                    <!-- AKTÍV TAGOK -->
                    <div>

                        <span class="metric-icon">
                            ♧
                        </span>

                        <strong
                            id="activeMembers"
                            class="metric-value"
                            aria-live="polite">
                            —
                        </strong>

                        <small>
                            AKTÍV TAG
                        </small>

                    </div>

                    <!-- NYITVATARTÁS -->
                    <div>

                        <span class="metric-icon">
                            ◷
                        </span>

                        <strong
                            id="openingHours"
                            class="metric-value"
                            aria-live="polite">
                            —
                        </strong>

                        <small>
                            NYITVATARTÁS
                        </small>

                    </div>

                    <!-- PRÉMIUM GÉPEK -->
                    <div>

                        <span class="metric-icon">
                            ▥
                        </span>

                        <strong
                            id="premiumMachines"
                            class="metric-value"
                            aria-live="polite">
                            —
                        </strong>

                        <small>
                            PRÉMIUM GÉP
                        </small>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <!-- Közös lábléc -->
    <footer id="site-footer"></footer>

    <!-- Bootstrap JavaScript -->
    <script src="../assets/bootstrap/bootstrap.bundle.min.js"></script>

    <!-- Közös frontend funkciók -->
    <script src="../mindegyik oldalhoz/mindegyikhez.js"></script>

    <!-- Spring Boot backend összekötés -->
    <script src="../mindegyik oldalhoz/osszekotes.js"></script>

    <!-- Kezdőlap saját JavaScript -->
    <script src="script.js"></script>

</body>
</html>
